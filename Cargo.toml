[workspace]
# Lightweight default workspace: ArcUI and symbol tooling remain in the tree,
# but are intentionally excluded from normal loader builds.
members = [
    ".",
]
exclude = [
    "crates/arcui-core",
    "crates/arcui-hook",
    "crates/arcui-platform-win32",
    "crates/arcui-renderer-dx11",
    "crates/arcui-renderer-dx12",
    "crates/lucide-arcui",
    "examples/bl_motion_blur",
    "bl-sdk",
]
resolver = "2"

[package]
name = "BLoader"
version = "0.2.56"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/Chlna6666/BLoader"
description = "Open-source Minecraft Bedrock mod loader"

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[features]
# Default build is deliberately small: no panel renderer and no Minecraft symbol pack loader.
default = []
# Kept as a future recovery switch. The source is preserved, but this feature is not enabled by default.
panel-ui = ["dep:arcui-core", "dep:arcui-hook", "dep:lucide-arcui", "dep:once_cell", "mc-symbols"]
mc-symbols = ["dep:flate2"]
blgen = ["dep:bl-sdk"]

[dependencies]
arcui-core = { path = "crates/arcui-core", optional = true }
arcui-hook = { path = "crates/arcui-hook", optional = true }
lucide-arcui = { path = "crates/lucide-arcui", optional = true }
once_cell = { version = "1.21.3", optional = true }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tracing = "0.1.44"
tracing-appender = "0.2.4"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt", "local-time"] }
time = { version = "0.3.47", features = ["formatting", "local-offset", "macros"] }
chrono = { version = "0.4.44", features = ["clock"] }
parking_lot = "0.12.5"
notify = "8.2.0"
once_cell_polyfill = "1.70.2"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Environment",
    "Win32_System_IO",
    "Win32_System_Kernel",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
thiserror = "2.0.18"
anyhow = "1.0.102"
rand = "0.10.0"
base64 = "0.22.1"
sha2 = "0.10.9"
p256 = { version = "0.13.2", features = ["ecdsa"] }
hex = "0.4.3"
url = "2.5.8"
flate2 = { version = "1.1.9", optional = true }
bl-sdk = { path = "bl-sdk", optional = true }

[build-dependencies]
chrono = "0.4.44"
winres = "0.1.12"

[dev-dependencies]
tempfile = "3.26.0"
