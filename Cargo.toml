[workspace]
# Lightweight default workspace: ArcUI and symbol tooling remain in the tree,
# but are intentionally excluded from normal loader builds.
members = [
    ".",
]
exclude = [
    "crates/arcui-core",
    "crates/arcui-hook",
    "crates/arcui-platform-win32",
    "crates/arcui-renderer-dx11",
    "crates/arcui-renderer-dx12",
    "crates/lucide-arcui",
    "examples/bl_motion_blur",
    "bl-sdk",
]
resolver = "2"

[package]
name = "BLoader"
version = "0.2.52"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/Chlna6666/BLoader"
description = "Open-source Minecraft Bedrock mod loader"

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[features]
# Default build is deliberately small: no panel renderer and no Minecraft symbol pack loader.
default = []
# Kept as a future recovery switch. The source is preserved, but this feature is not enabled by default.
panel-ui = ["dep:arcui-core", "dep:arcui-hook", "dep:lucide-arcui", "dep:once_cell", "mc-symbols"]
mc-symbols = ["dep:flate2"]
blgen = ["dep:bl-sdk"]

[dependencies]
arcui-core = { path = "crates/arcui-core", optional = true }
arcui-hook = { path = "crates/arcui-hook", optional = true }
lucide-arcui = { path = "crates/lucide-arcui", optional = true }
bl-sdk = { path = "bl-sdk", optional = true }
chrono = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
minhook = "0.9.0"
notify = "8.2.0"
parking_lot = "0.12.3"
once_cell = { version = "1.21.3", optional = true }
aes = "0.8.4"
base64 = "0.22.1"
sha2 = "0.10.9"
zeroize = { version = "1.8.2", features = ["derive"] }
flate2 = { version = "1.0", optional = true }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
tracing-appender = "0.2.3"

# Windows API
[dependencies.windows]
version = "0.62.2"
features = ["Win32_Foundation", "Win32_System_SystemServices", "Win32_System_SystemInformation", "Win32_System_LibraryLoader", "Win32_System_Console", "Win32_System_Pipes", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_Security", "Win32_Security_Cryptography", "Win32_System_IO", "Win32_UI", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Environment", "Win32_Security_Authorization", "Win32_System_Memory", "Win32_System_Kernel", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D_Fxc", "Win32_Graphics_Direct3D11", "Win32_Graphics_Direct3D12", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi", "Win32_Networking_WinSock", "Win32_System_ProcessStatus", "Win32_System_Diagnostics_Debug", "Win32_System_Diagnostics_ToolHelp"]
[build-dependencies]
winres = "0.1"

[[bin]]
name = "blgen"
path = "src/bin/blgen.rs"
required-features = ["blgen"]

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
