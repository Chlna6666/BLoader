[package]
name = "bloader_crash_logger"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "BLoaderCrashLogger"
path = "src/main.rs"

[dependencies]
chrono = "0.4"

[dependencies.windows]
version = "0.62.2"
features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
    "Win32_System_Kernel",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_ProcessStatus",
]
