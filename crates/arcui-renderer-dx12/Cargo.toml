[package]
name = "arcui-renderer-dx12"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[dependencies]
arcui-core = { path = "../arcui-core" }

[dependencies.windows]
version = "0.62.2"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
]
