name: Apply BLoader 0.2.70

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/apply-bloader-0270.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply source changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          token_path = Path('src/core/xuser_bridge/token.rs')
          token = token_path.read_text(encoding='utf-8')

          token = token.replace(
              'const XUSER_ADD_DEFAULT_USER_SILENTLY: u32 = 0x01;\n',
              'const XUSER_ADD_DEFAULT_USER_SILENTLY: u32 = 0x01;\nconst XUSER_TOKEN_FORCE_REFRESH: u32 = 0x01;\n',
          )

          token = token.replace(
              '    let key = format!("{relying_party}|{url}");\n    if !diagnostic_probe_once(key) {\n        return;\n    }\n',
              '    let key = relying_party.to_string();\n    if !diagnostic_probe_once(key) {\n        log_once(format!("diagnostic-duplicate:{relying_party}"), || {\n            bridge_info(&format!(\n                "pre-XSTS builder 诊断已存在；跳过重复启动 | rp={relying_party} | reason=diagnostic-already-started-or-completed | secrets_logged=false"\n            ));\n        });\n        return;\n    }\n',
          )

          token = token.replace(
              '    let context = Box::new(NativeTokenProbeContext {\n        relying_party,\n        native_user,\n        native_xuid,\n        method,\n        url,\n    });\n',
              '    let diagnostic_options = options | XUSER_TOKEN_FORCE_REFRESH;\n\n    let context = Box::new(NativeTokenProbeContext {\n        relying_party,\n        native_user,\n        native_xuid,\n        method,\n        url,\n    });\n',
          )

          token = token.replace(
              '            native_user,\n            options,\n            method_ptr,\n',
              '            native_user,\n            diagnostic_options,\n            method_ptr,\n',
          )

          token = token.replace(
              '        "pre-XSTS builder 诊断 native token 请求已启动 | rp={relying_party_for_log} | native_xuid={native_xuid} | mode=trigger-builder-probe-only | result_returned_to_minecraft=false | result_discarded=true | secrets_logged=false"\n',
              '        "pre-XSTS builder 诊断 native token 请求已启动 | rp={relying_party_for_log} | native_xuid={native_xuid} | mode=trigger-builder-probe-only | diagnostic_force_refresh=true | original_options=0x{options:08X} | diagnostic_options=0x{diagnostic_options:08X} | result_returned_to_minecraft=false | result_discarded=true | secrets_logged=false"\n',
          )

          if 'XUSER_TOKEN_FORCE_REFRESH' not in token or 'diagnostic_force_refresh=true' not in token:
              raise SystemExit('token.rs patch markers missing')

          token_path.write_text(token, encoding='utf-8')

          cargo = Path('Cargo.toml')
          cargo_text = cargo.read_text(encoding='utf-8').replace('version = "0.2.69"', 'version = "0.2.70"')
          cargo.write_text(cargo_text, encoding='utf-8')

          release_doc = Path('docs/releases/0.2.70.md')
          release_doc.write_text('''# BLoader 0.2.70\n\n## 修复\n\n- 跨账号 pre-XSTS 诊断 native token 请求现在强制设置 `XUSER_TOKEN_FORCE_REFRESH`，避免 Microsoft Runtime 直接返回缓存 XSTS 而不执行 `UserTokens`/`DeviceToken`/`TitleToken` 聚合路径。\n- 诊断触发按 relying party 去重；同一 RP 已启动或完成诊断时不再重复 silent native Add，降低 `http://xboxlive.com` 重复请求造成的日志噪音和 native handle 压力。\n\n## 安全边界\n\n- 诊断结果继续丢弃，不返回给 Minecraft。\n- 不读取、不输出 UToken、XSTS、Signature 或请求正文。\n- 跨账号和无 matching native user 的认证路径仍然 fail-closed，直到 pre-XSTS UserTokens ABI 被确认。\n''', encoding='utf-8')

          Path('.github/workflows/apply-bloader-0270.yml').unlink(missing_ok=True)
          PY
      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml src/core/xuser_bridge/token.rs docs/releases/0.2.70.md .github/workflows/apply-bloader-0270.yml
          git commit -m "fix(xuser): force-refresh and dedupe pre-XSTS diagnostics"
          git push
