name: Fix BLoader 0.2.73 JSON Keys

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/apply-bloader-0273-jsonkey-fix.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix serialized JSON key literals
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/core/xuser_bridge/pre_xsts.rs')
          s = p.read_text(encoding='utf-8')
          replacements = {
              'br#"\\"UserTokens\\""#': 'br#""UserTokens""#',
              'br#"\\"DeviceToken\\""#': 'br#""DeviceToken""#',
              'br#"\\"TitleToken\\""#': 'br#""TitleToken""#',
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'missing JSON key literal: {old}')
              s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
          PY
          cargo fmt --all
      - name: Commit fix
        shell: bash
        run: |
          rm -f .github/workflows/apply-bloader-0273-jsonkey-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/core/xuser_bridge/pre_xsts.rs .github/workflows/apply-bloader-0273-jsonkey-fix.yml
          git commit -m "fix(xuser): match serialized XSTS JSON keys"
          git push origin HEAD:master
