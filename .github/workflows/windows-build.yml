name: Windows Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build BLoader (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust versions
        shell: pwsh
        run: |
          rustc --version
          cargo --version

      - name: Build release
        shell: pwsh
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Upload BLoader artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BLoader-windows-x64
          if-no-files-found: error
          path: |
            target/x86_64-pc-windows-msvc/release/BLoader.dll
            target/x86_64-pc-windows-msvc/release/BLoader.pdb
            target/x86_64-pc-windows-msvc/release/BLoaderConsoleHost.exe
            target/x86_64-pc-windows-msvc/release/BLoaderConsoleHost.pdb
