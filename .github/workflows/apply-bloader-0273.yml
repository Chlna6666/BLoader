          t = t.replace(old, new, 1)

          old = '        return Ok(SameIdentityNativeCapability { user: native_user });\n'
          new = '        return Ok(MicrosoftAuthCapability::SameIdentity(SameIdentityNativeCapability { user: native_user }));\n'
          if old not in t:
              raise SystemExit('same identity return marker missing')
          t = t.replace(old, new, 1)

          old = '''    let native_identity_relation = match runtime.native_system_xuid_hint {
                  Some(native_xuid) if native_xuid == runtime.xuid => "same-hint-no-verified-capability",
                  Some(_) => "different",
                  None => "none",
              };

              let discovery = pre_xsts::ensure_discovered();
          '''
          new = '''    let cached_capability = cached_auth_capability_user();
              let native_identity_relation = cached_capability.map_or_else(
                  || match runtime.native_system_xuid_hint {
                      Some(native_xuid) if native_xuid == runtime.xuid => "same-hint-no-verified-capability",
                      Some(_) => "different",
                      None => "none",
                  },
                  |(_, native_xuid)| native_relation(native_xuid),
              );

              let discovery = pre_xsts::ensure_discovered();
              if pre_xsts::custom_user_injection_ready()
                  && let Some((native_user, native_xuid)) = cached_capability
              {
                  let key = format!("pre-xsts-ready:{relying_party}");
                  log_once(key, || {
                      bridge_info(&format!(
                          "pre-XSTS UToken 注入 ABI 已解析；启用跨身份 Microsoft Runtime 认证能力路径 | rp={relying_party} | custom_xuid={} | native_xuid={native_xuid} | native_identity_relation={} | route=virtual-user-pre-xsts-injected | identity_owner=bloader-virtual-xuser | native_user_is_backing_identity=false | DToken=official | UToken=bmcbl-custom | TToken=official | XSTS=official-after-user-substitution | signature=official | secrets_logged=false",
                          runtime.xuid,
                          native_relation(native_xuid),
                      ));
                  });
                  return Ok(MicrosoftAuthCapability::PreXstsInjected {
                      user: native_user,
                      native_xuid,
                  });
              }
          '''
          if old not in t:
              raise SystemExit('native relation/discovery marker missing')
          t = t.replace(old, new, 1)

          token.write_text(t, encoding='utf-8')

          cargo = Path('Cargo.toml')
          c = cargo.read_text(encoding='utf-8')
          if 'version = "0.2.72"' not in c:
              raise SystemExit('Cargo version 0.2.72 missing')
          cargo.write_text(c.replace('version = "0.2.72"', 'version = "0.2.73"', 1), encoding='utf-8')

          release = Path('docs/releases/0.2.73.md')
          release.write_text('''# BLoader 0.2.73\n\n## pre-XSTS ABI 自举\n\n- 修复 0.2.71/0.2.72 已定义 `install_call_target_probes` 但未调用，导致 direct-call 候选从未真正安装探针的问题。\n- call-target 探针现在优先覆盖 `UserTokens` xref 后的 helper，并使用剩余槽位覆盖 builder 内其他唯一 helper。\n- 增加安全的参数 marker hint，只报告 `UserTokens` / `DeviceToken` / `TitleToken` 所在参数或一级间接指针，不输出 Token 内容。\n- 对直接传入的完整 pre-XSTS JSON 文档进行保守 ABI 自举：仅当同一文档同时包含 `UserTokens`、`DeviceToken`、`TitleToken` 时，替换 `UserTokens` 数组为 BMCBL 的 B UToken，保留微软官方 DToken/TToken。\n- 自动识别可选的长度参数；替换缓冲区仅在 helper 调用期间存活并在释放时清零。\n\n## B != A\n\n- 诊断阶段取得的 silent native XUser 只缓存为 Microsoft Runtime 认证能力句柄，不成为 BLoader 的公开/背后用户身份。\n- ABI 自举成功后，后续 `XUserGetTokenAndSignature*` 可使用 native A 触发微软官方 DToken/TToken/XSTS/Signature 链，而 pre-XSTS hook 在 `xsts/authorize` 前把 `UserTokens(A)` 替换成 `UToken(B)`。\n- ABI 未解析时仍 fail-closed，绝不返回未经替换的 A 最终 XSTS。\n\n## 无系统账号\n\n- Synthetic XUser(B) 继续完全可建立且不触发系统登录 UI。\n- 当前版本仍不会伪造 Microsoft native XUser。若 Windows 没有任何 silent native capability user，则没有安全的官方 D/T 请求触发上下文，Token 路径继续 fail-closed。后续需在已确认的 Runtime ABI 上继续下探到不依赖 native XUser 的 Device/Title capability provider。\n\n## 安全\n\n- 日志不输出 UToken、A Token、XSTS、Signature、JSON 正文或请求正文。\n- ABI 仅在真实 helper 调用成功返回后标记 ready；无法确认完整 D/T/U 聚合文档时透明转发，不做修改。\n''', encoding='utf-8')

          print('patched 0.2.73')
          PY
          python3 /tmp/apply_0273.py
      - name: Format Rust
        run: cargo fmt --all
      - name: Commit source changes
        shell: bash
        run: |
          rm -f .github/workflows/apply-bloader-0273.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/core/xuser_bridge/pre_xsts.rs src/core/xuser_bridge/token.rs Cargo.toml docs/releases/0.2.73.md .github/workflows/apply-bloader-0273.yml
          git commit -m "feat(xuser): bootstrap pre-XSTS UToken ABI"
          git push origin HEAD:master
