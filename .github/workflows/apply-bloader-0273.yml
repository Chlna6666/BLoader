              }
              if should_log {
          '''
          if old not in text:
              raise SystemExit('call target invocation marker missing')
          text = text.replace(old, new, 1)

          insert_marker = 'unsafe fn install_builder_probe(base: usize, image_size: usize, bounds: FunctionBounds) {'
          if insert_marker not in text:
